name: Build and deploy Node.js project to Azure Function App - MedaraEmarDevImages

on:
  push:
    branches:
      - feature
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'   # Path to your function app project
  NODE_VERSION: '20.x'                  # Use Node 20 LTS (stable for Functions)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and Build
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write   # Required for workload identity federation
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp
          path: ./functionapp

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B8137DE0A4140A2930073AF380D1C28 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0FA71E913E446E69F46BA7ADFA29B7A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14E271A9F0FD4403BBAF07D720D27DA6 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'MedaraEmarDevImages'
          slot-name: 'Production'
          package: './functionapp'