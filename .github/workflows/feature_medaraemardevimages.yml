name: Build and deploy Node.js project to Azure Function App - MedaraEmarDevImages

on:
  push:
    branches:
      - feature
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'   # Path to your function app project
  NODE_VERSION: '22.x'                  # Use Node 22 LTS (stable for Functions)
  DEPLOY_ARTIFACT_PATH: './deploy-package'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Resolve Project Dependencies Using Npm'
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm ci
          npm run build --if-present
          npm run test --if-present
          popd

      - name: Prepare deployment package
        shell: pwsh
        run: |
          $deployPath = "${{ env.DEPLOY_ARTIFACT_PATH }}"
          if (Test-Path $deployPath) {
            Remove-Item -Recurse -Force $deployPath
          }

          New-Item -ItemType Directory -Path $deployPath | Out-Null
          Copy-Item host.json $deployPath
          Copy-Item package.json $deployPath
          Copy-Item package-lock.json $deployPath
          Copy-Item README.md $deployPath -ErrorAction SilentlyContinue
          Copy-Item src $deployPath -Recurse

          Push-Location $deployPath
          npm ci --omit=dev
          Pop-Location

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.DEPLOY_ARTIFACT_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ${{ env.DEPLOY_ARTIFACT_PATH }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B8137DE0A4140A2930073AF380D1C28 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0FA71E913E446E69F46BA7ADFA29B7A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14E271A9F0FD4403BBAF07D720D27DA6 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'MedaraEmarDevImages'
          slot-name: 'Production'
          package: ${{ env.DEPLOY_ARTIFACT_PATH }}